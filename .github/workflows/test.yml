name: test

on:
    workflow_call:

permissions:
    contents: read

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: setup-mise
              uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

            - name: install-dependencies
              run: uv sync --all-extras --all-groups --frozen

            - name: setup-path
              run: echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

            - name: run-tests
              run: bake test

    test-integration:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: setup-mise
              uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

            - name: install-dependencies
              run: uv sync --all-extras --all-groups --frozen

            - name: setup-path
              run: echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

            - name: run-integration-tests
              run: bake test-integration
