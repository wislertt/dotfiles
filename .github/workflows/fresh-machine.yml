name: fresh-machine

on:
    workflow_call:
    schedule:
        - cron: "0 5 * * 1" # weekly, Monday 5 AM, to catch upstream drift
    workflow_dispatch:

permissions:
    contents: read

jobs:
    fresh-machine:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        env:
            FNOX_PROFILE: ci
            MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: false

            - name: setup-mise
              uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

            - name: install-dependencies
              run: uv sync --all-extras --all-groups --frozen

            - name: setup-path
              run: echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

            - name: pin-preinstalled-brew-formulas
              if: runner.os == 'macOS'
              # same as the bakefile repo: the real brew upgrade runs but skips the runner's own formulas
              run: brew pin $(brew list --formula)

            - name: store-bitwarden-token
              # no terminal to paste into, so store it the way a person would with bake secret set
              run: |
                  bake setup-fnox
                  bake secret set FNOX_BWS_ACCESS_TOKEN "$BWS_TOKEN"
              env:
                  BWS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN_DEV }}

            - name: setup-dev
              run: bake setup-dev

            - name: apply-again-and-check-links-unchanged
              run: |
                  find "$HOME" -maxdepth 6 -type l -lname "${{ github.workspace }}/*" | sort > links-first.txt
                  bake apply
                  find "$HOME" -maxdepth 6 -type l -lname "${{ github.workspace }}/*" | sort > links-second.txt
                  test -s links-first.txt
                  diff links-first.txt links-second.txt
