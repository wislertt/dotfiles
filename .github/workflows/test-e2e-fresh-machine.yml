name: test-e2e-fresh-machine

on:
    workflow_call:
    schedule:
        - cron: "0 5 * * 1" # weekly, Monday 5 AM, to catch upstream drift
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-e2e-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        # bash -eo pipefail, so a failing command in a pipeline fails the step
        shell: bash

jobs:
    test-e2e-fresh-machine:
        name: test-e2e-fresh-machine
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        environment: development
        timeout-minutes: 60
        env:
            FNOX_PROFILE: ci
            DOTFILES_MACHINE_NAME: ci # no private machine list here, and no terminal to ask in
            MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  submodules: false
                  persist-credentials: false

            - name: setup-mise
              uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

            - name: install-zsh
              # same as pre-commit.yml: lint runs `zsh -n`, and the Ubuntu runner ships without zsh
              if: ${{ runner.os == 'Linux' }}
              run: sudo apt-get install -y zsh

            - name: install-dependencies
              run: uv sync --all-extras --all-groups --frozen

            - name: setup-path
              run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

            - name: pin-preinstalled-brew-formulas
              if: ${{ runner.os == 'macOS' }}
              # same as the bakefile repo: the real brew upgrade runs but skips the runner's own formulas
              run: brew list --formula | xargs brew pin

            - name: store-bitwarden-token
              # no terminal to paste into, so store it the way a person would with bake secret set
              run: |
                  bake setup-fnox
                  bake secret set FNOX_BWS_ACCESS_TOKEN "$BWS_TOKEN"
              env:
                  BWS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

            - name: setup-dev
              run: bake setup-dev

            - name: assert-setup-dev
              run: bake assert-setup-dev

            - name: check-shell-startup-time
              # loose limit: catches a module that slows every shell, not small drift
              run: |
                  zsh -i -c exit </dev/null >/dev/null 2>&1
                  TIMEFORMAT=%R
                  limit=1.5
                  best=$(for _ in 1 2 3 4 5; do { time zsh -i -c exit </dev/null >/dev/null 2>&1; } 2>&1; done | sort -n | head -1)
                  echo "fastest of 5 interactive zsh starts: ${best}s (limit ${limit}s)"
                  awk -v t="$best" -v l="$limit" 'BEGIN { exit !(t <= l) }'

            - name: apply-again-and-check-links-unchanged
              run: |
                  find "$HOME" -maxdepth 6 -type l -lname "$GITHUB_WORKSPACE/*" | sort > links-first.txt
                  bake apply
                  find "$HOME" -maxdepth 6 -type l -lname "$GITHUB_WORKSPACE/*" | sort > links-second.txt
                  test -s links-first.txt
                  diff links-first.txt links-second.txt
