name: pre-commit

on:
    workflow_call:

permissions:
    contents: read

jobs:
    pre-commit:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: setup-mise
              uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

            - name: install-zsh
              run: sudo apt-get install -y zsh

            - name: install-zsh
              run: sudo apt-get install -y zsh

            - name: install-dependencies
              run: uv sync --all-extras --all-groups --frozen

            - name: setup-path
              run: echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

            - name: run-pre-commit
              run: SKIP=lint pre-commit run --all-files

            - name: run-lint
              run: bake lint --slow
              env:
                  # lets zizmor run its online audits (impostor commits, known-vulnerable actions)
                  GH_TOKEN: ${{ github.token }}
