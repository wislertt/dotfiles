[project]
name = "dotfiles"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
  "bakefile[lib]>=0.0.92",
  "identify>=2.6.20",
  "typer>=0.15.0"
]

[dependency-groups]
dev = [
  "deptry>=0.24.0",
  "pytest-cov>=7.1.0",
  "pytest>=9.2.0"
]

[tool.deptry]
extend_exclude = ["private"]
known_first_party = ["src"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]

[tool.uv]
package = false
