[project]
name = "dotfiles"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
  "bakefile[lib]>=0.0.85",
  "identify>=2.6.20"
]

[dependency-groups]
dev = [
  "deptry>=0.24.0",
  "pytest>=9.2.0"
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]

[tool.uv]
package = false
