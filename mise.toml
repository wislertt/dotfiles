# Machine setup: `mise install`, then `bake setup-dev` (see README)
[bootstrap]
dotfile_groups = ["bin", "config", "home"]

# Groups, not [dotfiles] entries: two [dotfiles] entries cannot share ~/.config with private.
[dotfile_groups.bin]
root = "src/bin"
target = "~/.local/bin"

[dotfile_groups.config]
root = "src/config"
target = "~/.config"

[dotfile_groups.home]
root = "src/home"
target = "~"

# bake falls back to ~/.config/bake/bakefile.py outside any project, and `bake -g` always uses it
[dotfiles."~/.config/bake"]
mode = "symlink"
source = "."

[settings.dotfiles]
root = "."

[tools]
actionlint = "latest"
# latest by default; pin a version only if a release breaks something, and say why
age = "latest"
bitwarden-secrets-manager = "latest"
bun = "latest"
fnox = "latest"
jq = "latest"
"npm:actions-up" = "latest"
"npm:oxfmt" = "latest"
"pipx:bakefile" = { version = "latest", extras = "locked" }
"pipx:pre-commit" = "latest"
"pipx:toml-sort" = "latest"
"pipx:zerv-version" = "latest"
shellcheck = "latest"
uv = "latest"
zizmor = "latest"
